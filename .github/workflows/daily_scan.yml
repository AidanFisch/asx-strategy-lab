name: ASX scan

# Fully-online automation (PC can be off):
#  * daily  -> live.monitor refreshes plan tickers and posts the BUY/SELL/HOLD
#              summary as a GitHub ISSUE (@mention -> you get an email + GitHub
#              app push). No external services or secrets needed.
#  * weekly -> full rescan: data + scanner2 + plans + validation + dashboard.
# Runners are ephemeral, so updated state (live.db, leaderboard, dashboard) is
# committed back to the repo.

on:
  schedule:
    # Daily monitor at 10:30 UTC Mon-Fri = 8:30pm AEST — AFTER every covered
    # market has closed and its daily bar is final (UTC closes: AU/JP 06:00,
    # KR 06:30, HK/CN 08:00, IN 10:00). Running earlier would evaluate HK/CN/IN
    # on partial or stale bars. You act at the next session's open anyway.
    - cron: "30 10 * * 1-5"
    - cron: "0 9 * * 6"      # weekly rescan, Sat 09:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor or rescan"
        default: monitor

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 9 * * 6" ] || [ "${{ github.event.inputs.mode }}" = "rescan" ]; then
            echo "mode=rescan" >> $GITHUB_OUTPUT
          else
            echo "mode=monitor" >> $GITHUB_OUTPUT
          fi

      - name: Daily monitor
        if: steps.mode.outputs.mode == 'monitor'
        # NOT --dry-run: this is the canonical daily run that maintains the paper
        # book (positions/trades in live.db). --dry-run is strictly read-only.
        run: python -m live.monitor --interval 1d --refresh --out summary.md

      - name: Post daily summary as issue
        if: steps.mode.outputs.mode == 'monitor'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@AidanFisch"
            echo
            cat summary.md
            echo
            echo "---"
            echo "[Dashboard](https://aidanfisch.github.io/asx-strategy-lab/) · [Runs](https://github.com/${{ github.repository }}/actions)"
          } > body.md
          # subject line = the TL;DR (3rd line of summary.md), markdown stripped
          TLDR=$(sed -n '3p' summary.md | sed 's/[*_]//g' | cut -c1-90)
          gh issue create \
            --title "📊 $(date -u +%F) — ${TLDR:-Daily signals}" \
            --body-file body.md \
            --repo "${{ github.repository }}"

      - name: Weekly rescan
        if: steps.mode.outputs.mode == 'rescan'
        run: |
          python download_data.py --interval 1d --universe
          python download_data.py --interval 1d --universe-file data/universe_asia.csv
          python -m backtest.scanner2 --interval 1d
          python -m plans --interval 1d
          python -m trade_details --interval 1d
          python -m robustness --interval 1d
          python -m liquidity --interval 1d
          python -m wfo --interval 1d
          python -m portfolio --interval 1d
          python -m regime --interval 1d
          python -m results.dashboard2 --interval 1d --pages
          python -m serving

      - name: Persist state
        run: |
          git config user.name  "asx-scan-bot"
          git config user.email "asx-scan-bot@users.noreply.github.com"
          git add results/live.db results/serving.db results/dashboard.html \
                  results/strategy_summary.csv results/all_results.csv.gz \
                  index.html docs 2>/dev/null || true
          git commit -m "chore: ${{ steps.mode.outputs.mode }} update [skip ci]" || echo "nothing to commit"
          git push
